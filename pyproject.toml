[project]
name = "xagent"
version = "0.1.0"
description = "Physical execution agent with tool-call loop and observability."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
observability = [
    "langfuse>=3.0.0",
]
web = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
    "selenium>=4.0.0",
    "uvicorn>=0.30.0",
]
semantic-search = [
    "sqlite-vec>=0.1.9,<0.2",
]

[dependency-groups]
dev = []
